name: Build and push images

# Builds ghcr.io/<owner>/frps and ghcr.io/<owner>/frpc from the official frp
# release archives. The image tags always match the upstream frp version
# (0.71.0, v0.71.0 and latest).
#
# Triggers
#   push to main / vX.Y.Z tag : build and push
#   pull request              : build and test only (nothing is pushed)
#   schedule (weekly)         : build and push, but only when frp released a
#                               version that is not in GHCR yet
#   manual                    : build a specific version on demand

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 03:00 UTC (= 11:00 Asia/Shanghai).
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: frp version, e.g. 0.71.0 (empty = newest upstream release)
        required: false
        type: string
        default: ''
      platforms:
        description: target platforms
        required: false
        type: string
        default: linux/amd64
      force:
        description: Build even when the images already exist
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Resolve frp version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_latest: ${{ steps.check.outputs.is_latest }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Resolve version and decide whether to build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # https://github.com/<repo>/releases/latest redirects to the newest
          # tag: no API call, no token, no rate limit.
          upstream="$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/fatedier/frp/releases/latest)"
          upstream="${upstream##*/}"
          upstream="${upstream#v}"

          version="${INPUT_VERSION:-}"
          version="${version#v}"
          if [ -z "$version" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="$upstream"
            fi
          fi

          is_latest=false
          if [ "$version" = "$upstream" ]; then
            is_latest=true
          fi

          # The weekly run is a no-op unless this frp version is still missing
          # from the container registry. A registry hiccup must not fail the
          # run, it only means we try to build.
          build=true
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${FORCE:-false}" != "true" ]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            code=""
            if token="$(curl -fsSL -u "${owner}:${GH_TOKEN}" \
                    "https://ghcr.io/token?scope=repository:${owner}/frps:pull&service=ghcr.io" \
                    2> /dev/null | jq -r '.token // empty')" \
                && [ -n "${token}" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${owner}/frps/manifests/${version}")" || code=""
            fi
            echo "ghcr.io/${owner}/frps:${version} -> HTTP ${code:-unknown}"
            if [ "${code}" = "200" ]; then
              build=false
            fi
          fi

          {
            echo "### frp container images"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| frp version | \`${version}\` |"
            echo "| upstream latest | \`${upstream}\` |"
            echo "| \`latest\` tag | ${is_latest} |"
            echo "| build | ${build} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "is_latest=${is_latest}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.component }} ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frps
            context: frps
          - component: frpc
            context: frpc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=v${{ needs.check.outputs.version }}
            type=raw,value=latest,enable=${{ needs.check.outputs.is_latest }}
            type=ref,event=pr,prefix=pr-

      - name: Build for testing (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: frp-${{ matrix.component }}:test
          provenance: false
          build-args: |
            FRP_VERSION=${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Test the image
        run: |
          set -eux
          image="frp-${{ matrix.component }}:test"

          reported="$(docker run --rm "$image" --version)"
          [ "$reported" = "${{ needs.check.outputs.version }}" ]

          docker run --rm --entrypoint sh "$image" -c "test -s /etc/frp/${{ matrix.component }}.toml"
          docker run --rm "$image" verify -c /etc/frp/${{ matrix.component }}.toml

          # Started without arguments the bundled configuration must come up.
          if [ "${{ matrix.component }}" = "frps" ]; then
            docker run -d --name smoke "$image" > /dev/null
            for _ in $(seq 1 20); do
              docker logs smoke 2>&1 | grep -q 'started successfully' && break
              sleep 1
            done
            docker logs smoke 2>&1 | grep -q 'started successfully'
            docker rm -f smoke > /dev/null
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            FRP_VERSION=${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Verify the published manifests
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            echo "== ${tag}"
            docker buildx imagetools inspect "${tag}" > /dev/null
          done <<< "${TAGS}"

